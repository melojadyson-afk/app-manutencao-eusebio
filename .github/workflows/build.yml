name: Atualizar APP Manutenção

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 9-23 * * *'
    - cron: '0 0-1 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Baixar a planilha mais recente do OneDrive
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_PLANILHA_URL }}
        run: |
          mkdir -p data
          curl -L -f -o data/planilha_novo.xlsx \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "${ONEDRIVE_URL}&download=1"

      - name: Validar se o arquivo baixado é realmente um .xlsx
        run: |
          SIG=$(head -c 2 data/planilha_novo.xlsx)
          SIZE_KB=$(du -k data/planilha_novo.xlsx | cut -f1)
          if [ "$SIG" != "PK" ] || [ "$SIZE_KB" -lt 500 ]; then
            echo "❌ O arquivo baixado não parece ser a planilha completa (assinatura: '$SIG', tamanho: ${SIZE_KB}KB)."
            echo "Conteúdo recebido (primeiros 300 caracteres):"
            head -c 300 data/planilha_novo.xlsx
            exit 1
          fi
          mv data/planilha_novo.xlsx data/planilha.xlsx
          echo "✅ Arquivo validado, ${SIZE_KB}KB"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas openpyxl numpy

      - name: Rodar extração e montar o app
        run: python scripts/extract.py

      - name: Publicar docs/index.html atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Atualização automática do APP Manutenção"
          git push
